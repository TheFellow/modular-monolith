name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  solution:
    runs-on: ubuntu-24.04
    env:
      MIXOLOGY_TEST_ORDER_SEED: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:spelling
      - run: dotnet tool restore
      - run: dotnet restore Mixology.slnx
      - run: dotnet build Mixology.slnx --no-restore
      - run: dotnet format Mixology.slnx --verify-no-changes --no-restore
      - name: Verify generated dispatcher
        run: >-
          dotnet run --project tools/Mixology.DispatchGenerator --no-build --
          --manifest src/Mixology.Dispatcher/dispatcher.routes.json
          --output src/Mixology.Dispatcher/Generated/DomainEventDispatcher.g.cs
          --check
      - name: Verify EF model freshness
        run: dotnet ef migrations has-pending-model-changes --project src/Mixology.Migrations --no-build
      - name: Run tests with randomized order
        run: |
          echo "Test order seed: ${MIXOLOGY_TEST_ORDER_SEED}"
          dotnet test Mixology.slnx --no-build
      - name: Detect managed data races in concurrency primitives
        run: >-
          dotnet sharpdetect run
          --target tests/Mixology.Toolkits.Desktop.Tests/bin/Debug/net10.0/Mixology.Toolkits.Desktop.Tests.dll
          --plugin FastTrack
          --test
          --runner VsTest
          --filter FullyQualifiedName~LatestRequestTests

  native-publish:
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            executable: Mixology.Desktop
          - os: windows-2025
            rid: win-x64
            executable: Mixology.Desktop.exe
          - os: macos-15-intel
            rid: osx-x64
            executable: Mixology.Desktop
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Publish self-contained desktop client
        shell: pwsh
        run: >-
          dotnet publish src/Mixology.Desktop/Mixology.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output "${{ runner.temp }}/mixology-${{ matrix.rid }}"
      - name: Run native help smoke
        shell: pwsh
        run: |
          $executable = Join-Path "${{ runner.temp }}/mixology-${{ matrix.rid }}" "${{ matrix.executable }}"
          if (-not (Test-Path $executable -PathType Leaf)) {
            throw "Missing published executable: $executable"
          }
          & $executable --help
          if ($LASTEXITCODE -ne 0) {
            throw "Published executable returned $LASTEXITCODE"
          }
