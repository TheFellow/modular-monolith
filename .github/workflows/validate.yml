name: Validate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  solution:
    runs-on: ubuntu-24.04
    env:
      MIXOLOGY_TEST_ORDER_SEED: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:spelling
      - run: dotnet tool restore
      - run: dotnet restore Mixology.slnx
      - run: dotnet build Mixology.slnx --no-restore
      - run: dotnet format Mixology.slnx --verify-no-changes --no-restore
      - name: Verify generated dispatcher
        run: >-
          dotnet run --project tools/Mixology.DispatchGenerator --no-build --
          --manifest src/Mixology.Dispatcher/dispatcher.routes.json
          --output src/Mixology.Dispatcher/Generated/DomainEventDispatcher.g.cs
          --check
      - name: Verify EF model freshness
        run: dotnet ef migrations has-pending-model-changes --project src/Mixology.Migrations --no-build
      - name: Run tests with randomized order
        run: |
          echo "Test order seed: ${MIXOLOGY_TEST_ORDER_SEED}"
          dotnet test Mixology.slnx --no-build
      - name: Detect managed data races in concurrency primitives
        run: dotnet sharpdetect run eng/sharpdetect-latest-request.json

  native-publish:
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            framework: net10.0-windows10.0.19041.0
            workload: maui-windows
          - os: macos-15-intel
            rid: maccatalyst-x64
            framework: net10.0-maccatalyst
            workload: maui-maccatalyst
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Select Xcode required by .NET Mac Catalyst
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app
      - name: Install native .NET MAUI workload
        run: dotnet workload install ${{ matrix.workload }} --skip-manifest-update
      - name: Publish native desktop client
        shell: pwsh
        run: >-
          dotnet publish src/Mixology.Desktop/Mixology.Desktop.csproj
          --configuration Release
          -p:BuildNativeDesktop=true
          --framework ${{ matrix.framework }}
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output "${{ runner.temp }}/mixology-${{ matrix.rid }}"
      - name: Verify native publish output
        shell: pwsh
        run: |
          $output = "${{ runner.temp }}/mixology-${{ matrix.rid }}"
          $artifacts = @(Get-ChildItem $output -Recurse -File)
          if ($artifacts.Count -eq 0) {
            throw "Native publish produced no files in $output"
          }
